name: Sync backend to Hugging Face Space

# Pushes chap34-backend/ as the root of a Hugging Face Space repo every time
# it changes on main. The Space rebuilds its Docker image automatically on
# receiving the push.
#
# One-time setup (see chap34-backend's README / DEPLOY.md):
#   1. Create a Docker-SDK Space at huggingface.co/new-space
#   2. Create an HF access token with "Write" permission
#   3. In this GitHub repo: Settings -> Secrets and variables -> Actions
#        - Secret:   HF_TOKEN        = the access token
#        - Variable: HF_USERNAME     = your Hugging Face username/org
#        - Variable: HF_SPACE_NAME   = the Space's slug

on:
  push:
    branches: [main]
    paths:
      - "chap34-backend/**"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push chap34-backend/ to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ] || [ -z "${HF_USERNAME:-}" ] || [ -z "${HF_SPACE_NAME:-}" ]; then
            echo "HF_TOKEN secret / HF_USERNAME / HF_SPACE_NAME variables are not set yet - skipping sync." \
                 "See the one-time setup steps in this workflow's header."
            exit 0
          fi

          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space
          cp -r chap34-backend/. /tmp/hf-space/

          cd /tmp/hf-space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync from GitHub ${GITHUB_SHA}"
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force space main
